name: Patch bootstrap low restriction

on:
  push:
    branches: [main]

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Remove bootstrap positive-return restriction') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/entry.ts')
          s = p.read_text()
          old = '''      Number(candidate.row.liquidityUsd >= BOOTSTRAP_MIN_LIQUIDITY_USD &&'''
          anchor = '''      candidate.row.volume5mUsd > 0 &&\n      Number(candidate.row.percent || 0) > 0'''
          new = '''      candidate.row.volume5mUsd > 0 &&\n      Number.isFinite(Number(candidate.row.percent || 0))'''
          if s.count(anchor) != 1:
              raise SystemExit(f'entry.ts: bootstrap anchor count {s.count(anchor)}, expected 1')
          p.write_text(s.replace(anchor, new, 1))
          if not p.read_text().strip():
              raise SystemExit('entry.ts became empty')
      - name: Validate
        run: |
          npm install
          npm run typecheck
          git diff --check
          test "$(git diff --name-only)" = "src/entry.ts"
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/entry.ts
          git diff --cached --check
          git commit -m 'Remove bootstrap positive-return restriction'
          git push origin main
