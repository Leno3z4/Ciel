name: Apply main fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          indexer = Path('src/indexer.ts')
          s = indexer.read_text()
          s = s.replace('const DISCOVERY_REFRESH_MS = 30 * 60 * 1000;\n', 'const DISCOVERY_REFRESH_MS = 30 * 60 * 1000;\nconst FACTORY_FALLBACK_PAIR_LIMIT = 48;\n')
          old_bootstrap = re.search(r'async function bootstrapFactory\(env: IndexEnv, client: ReturnType<typeof publicClient>\): Promise<void> \{.*?\n\}\n\nexport async function indexNadFun', s, re.S)
          if not old_bootstrap:
              raise SystemExit('bootstrapFactory block not found')
          new_bootstrap = '''async function bootstrapFactory(env: IndexEnv, client: ReturnType<typeof publicClient>, maxPairs = FACTORY_FALLBACK_PAIR_LIMIT): Promise<void> {
            try {
              const total = Number(await client.readContract({ address: NADFUN_FACTORY, abi: factoryAbi, functionName: "allPairsLength" }));
              const start = Math.max(0, total - Math.max(1, Math.min(maxPairs, 64)));
              for (let i = start; i < total; i++) {
                const p = await client.readContract({ address: NADFUN_FACTORY, abi: factoryAbi, functionName: "allPairs", args: [BigInt(i)] });
                const [a, b] = await Promise.all([client.readContract({ address: p, abi: factoryPairAbi, functionName: "token0" }), client.readContract({ address: p, abi: factoryPairAbi, functionName: "token1" })]);
                const aq = a.toLowerCase() === WMON.toLowerCase() || a.toLowerCase() === LVMON.toLowerCase();
                const bq = b.toLowerCase() === WMON.toLowerCase() || b.toLowerCase() === LVMON.toLowerCase();
                if (!aq && !bq) continue;
                const token = aq ? b : a;
                await seed(env, token, undefined);
                const [supply, decimals] = await Promise.all([
                  client.readContract({ address: token, abi: tokenMetaAbi, functionName: "totalSupply" }).catch(() => null),
                  client.readContract({ address: token, abi: tokenMetaAbi, functionName: "decimals" }).catch(() => 18)
                ]);
                await env.DB.prepare("UPDATE tokens SET quote_token=?,pair_address=?,graduated=1,total_supply=COALESCE(?,total_supply),decimals=? WHERE address=?").bind(aq ? a : b, p, supply?.toString() ?? null, Number(decimals), token).run();
              }
            } catch (e) {
              console.error(`Factory bootstrap failed: ${String(e).slice(0, 300)}`);
            }
          }

          export async function indexNadFun'''
          s = s[:old_bootstrap.start()] + new_bootstrap + s[old_bootstrap.end()-len('export async function indexNadFun'):] 
          old_discovery = '''  await bootstrapFactory(env, client);

  let discovery: NadFunToken[] = ranked;
  if (!discovery.length) discovery = await fetchRanked(env, true);
  const rankedByToken = new Map<string, NadFunToken>();
  let validAddressCount = 0;
  for (const item of discovery) { const t = tokenAddress(item); if (t) { rankedByToken.set(t.toLowerCase(), item); validAddressCount++; } }
  for (const item of discovery) { const t = tokenAddress(item); if (t) await seed(env, t, item); }
'''
          new_discovery = '''  let discovery: NadFunToken[] = ranked;
  if (!discovery.length) discovery = await fetchRanked(env, true);
  const rankedByToken = new Map<string, NadFunToken>();
  let validAddressCount = 0;
  for (const item of discovery) { const t = tokenAddress(item); if (t) { rankedByToken.set(t.toLowerCase(), item); validAddressCount++; } }
  if (validAddressCount === 0) {
    await bootstrapFactory(env, client);
  }
  for (const item of discovery) { const t = tokenAddress(item); if (t) await seed(env, t, item); }
'''
          if old_discovery not in s:
              raise SystemExit('discovery block not found')
          s = s.replace(old_discovery, new_discovery)
          s = s.replace('if (chartAttempts < 6)', 'if (chartAttempts < 12)')
          indexer.write_text(s)

          main = Path('src/index.ts')
          s = main.read_text()
          s = s.replace('  lastIndexerSells?: number;\n', '  lastIndexerSells?: number;\n  lastIndexerDiscoveryCount?: number;\n  lastIndexerValidAddressCount?: number;\n  lastIndexerCandidateCount?: number;\n  lastIndexerDirectEligible?: number;\n  lastIndexerCapEligible?: number;\n  lastIndexerChartAttempts?: number;\n  lastIndexerChartHits?: number;\n  lastIndexerSkipReason?: string;\n')
          s = s.replace('const PATTERN_MAX_CANDIDATES = 10;\n', 'const PATTERN_MAX_CANDIDATES = 10;\nconst MARKET_MONITOR_INTERVAL_MS = 15 * 60 * 1000;\n')
          s = s.replace('`No established high-volume meme candidates above $${PATTERN_MIN_MARKET_CAP_USD.toLocaleString()} yet`', '`No established market-cap snapshots met the $${PATTERN_MIN_MARKET_CAP_USD.toLocaleString()} / history / volume / liquidity gates`')
          marker = 'async function runMarketCycle(env: Env) {'
          if marker not in s:
              raise SystemExit('runMarketCycle marker not found')
          helper = '''async function buildMarketMonitorReport(env: Env): Promise<string | null> {
  const lastSent = Number(await env.CIEL_STATE.get("ciel_market_monitor_last_sent_ms") || "0");
  if (lastSent > 0 && Date.now() - lastSent < MARKET_MONITOR_INTERVAL_MS) return null;
  const established = await env.DB.prepare(`SELECT COUNT(*) as count FROM (SELECT token_address FROM market_snapshots WHERE price_usd>0 GROUP BY token_address HAVING COUNT(*)>=? AND (MAX(ts_ms)-MIN(ts_ms))>=? AND AVG(volume_5m_usd)>=? AND AVG(liquidity_usd)>=? AND AVG(market_cap_usd)>=?)`).bind(
    PATTERN_MIN_HISTORY_SAMPLES,
    PATTERN_MIN_HISTORY_HOURS * 3600000,
    PATTERN_MIN_AVG_VOLUME_5M_USD,
    PATTERN_MIN_AVG_LIQUIDITY_USD,
    PATTERN_MIN_MARKET_CAP_USD
  ).first<{ count: number }>();
  const rows = await env.DB.prepare(`SELECT s.token_address as token, t.symbol as symbol, s.market_cap_usd as cap,
      ((s.market_cap_usd - COALESCE((SELECT h.market_cap_usd FROM market_snapshots h WHERE h.token_address=s.token_address AND h.ts_ms<=s.ts_ms-1800000 AND h.market_cap_usd>0 ORDER BY h.ts_ms DESC LIMIT 1),s.market_cap_usd)) / NULLIF((SELECT h.market_cap_usd FROM market_snapshots h WHERE h.token_address=s.token_address AND h.ts_ms<=s.ts_ms-1800000 AND h.market_cap_usd>0 ORDER BY h.ts_ms DESC LIMIT 1),0))*100 as ret30,
      ((s.market_cap_usd - COALESCE((SELECT h.market_cap_usd FROM market_snapshots h WHERE h.token_address=s.token_address AND h.ts_ms<=s.ts_ms-7200000 AND h.market_cap_usd>0 ORDER BY h.ts_ms DESC LIMIT 1),s.market_cap_usd)) / NULLIF((SELECT h.market_cap_usd FROM market_snapshots h WHERE h.token_address=s.token_address AND h.ts_ms<=s.ts_ms-7200000 AND h.market_cap_usd>0 ORDER BY h.ts_ms DESC LIMIT 1),0))*100 as ret2h
    FROM market_snapshots s LEFT JOIN tokens t ON t.address=s.token_address
    WHERE s.ts_ms=(SELECT MAX(x.ts_ms) FROM market_snapshots x WHERE x.token_address=s.token_address) AND s.market_cap_usd>=?
    ORDER BY s.market_cap_usd DESC LIMIT 5`).bind(PATTERN_MIN_MARKET_CAP_USD).all<{ token: string; symbol: string | null; cap: number; ret30: number | null; ret2h: number | null }>();
  if (!(rows.results?.length)) return null;
  const fmtUsd = (value: number) => value >= 1000000 ? `$${(value/1000000).toFixed(2)}M` : `$${(value/1000).toFixed(1)}K`;
  const fmtPct = (value: number | null) => Number.isFinite(Number(value)) ? `${Number(value) >= 0 ? "+" : ""}${Number(value).toFixed(1)}%` : "n/a";
  const top = (rows.results || []).map((row, i) => `${i + 1}. ${row.symbol || row.token.slice(0, 10)} — ${fmtUsd(Number(row.cap))} | ${fmtPct(row.ret30)} 30m | ${fmtPct(row.ret2h)} 2h`);
  return `📊 Ciel market monitor\nEstablished markets: ${Number(established?.count || 0)}\nMarket-cap floor: ≥$${PATTERN_MIN_MARKET_CAP_USD.toLocaleString()}\n\nTop markets\n${top.join("\n")}`.slice(0, 3900);
}

'''
          s = s.replace(marker, helper + marker)
          old_cycle = 'if (result && (result.snapshots > 0 || result.buys > 0 || result.sells > 0)) await notifyTelegram(env, `📡 Ciel indexer\\nBlocks: ${result.fromBlock.toString()} - ${result.toBlock.toString()}\\nCreates: ${result.creates}\\nBuys: ${result.buys}\\nSells: ${result.sells}\\nSnapshots: ${result.snapshots}`);'
          new_cycle = '''if (result && result.snapshots > 0) {
      const report = await buildMarketMonitorReport(env);
      if (report) {
        await notifyTelegram(env, report);
        await env.CIEL_STATE.put("ciel_market_monitor_last_sent_ms", String(Date.now()), { expirationTtl: 86400 });
      }
    }'''
          if old_cycle not in s:
              raise SystemExit('old Telegram cycle notification not found')
          s = s.replace(old_cycle, new_cycle)
          old_status = 'lastIndexerSells: state.lastIndexerSells ?? null, lastGeminiAttempt:'
          new_status = 'lastIndexerSells: state.lastIndexerSells ?? null, lastIndexerDiscoveryCount: state.lastIndexerDiscoveryCount ?? null, lastIndexerValidAddressCount: state.lastIndexerValidAddressCount ?? null, lastIndexerCandidateCount: state.lastIndexerCandidateCount ?? null, lastIndexerDirectEligible: state.lastIndexerDirectEligible ?? null, lastIndexerCapEligible: state.lastIndexerCapEligible ?? null, lastIndexerChartAttempts: state.lastIndexerChartAttempts ?? null, lastIndexerChartHits: state.lastIndexerChartHits ?? null, lastIndexerSkipReason: state.lastIndexerSkipReason ?? null, lastGeminiAttempt:'
          if old_status not in s:
              raise SystemExit('status insertion point not found')
          s = s.replace(old_status, new_status)
          main.write_text(s)

          # Restore the normal CI workflow in the same commit so this helper never remains in main.
          Path('.github/workflows/ci.yml').write_text('''name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
''')
          PY
      - name: Validate source
        run: |
          git diff --check
          npm install
          npm run typecheck
      - name: Commit directly to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/indexer.ts src/index.ts .github/workflows/ci.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore established market discovery and monitoring"
          git push origin HEAD:main
