name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair Gemini maintenance caller
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/index.ts')
          text = p.read_text()
          start = text.index('async function runModelMaintenance(env: Env) {')
          end = text.index('\n\nasync function status(env: Env) {', start)
          replacement = r'''async function runModelMaintenance(env: Env) {
  const maintenanceAt = Date.now();
  try {
    await ensureDatabaseSchema(env);

    const latest = await env.DB.prepare(`SELECT token_address as token,ts_ms as tsMs,price_usd as priceUsd,market_cap_usd as marketCapUsd,liquidity_usd as liquidityUsd,volume_5m_usd as volume5mUsd,buys_5m as buys5m,sells_5m as sells5m,holders
      FROM market_snapshots WHERE price_usd>0 ORDER BY ts_ms DESC LIMIT 1`).first<Snapshot>();
    if (!latest) {
      await writeRuntimeState(env, { lastModelMaintenance: maintenanceAt, lastModelError: undefined });
      return;
    }

    const historyResult = await env.DB.prepare(`SELECT token_address as token,ts_ms as tsMs,price_usd as priceUsd,market_cap_usd as marketCapUsd,liquidity_usd as liquidityUsd,volume_5m_usd as volume5mUsd,buys_5m as buys5m,sells_5m as sells5m,holders
      FROM market_snapshots WHERE token_address=? AND price_usd>0 ORDER BY ts_ms DESC LIMIT 50`).bind(latest.token).all<Snapshot>();
    const history = historyResult.results || [];
    const current = history[0] || latest;
    const baseline = buildBaseline(history);
    const score = deviationScore(current, baseline);
    await writeRuntimeState(env, { lastModelMaintenance: maintenanceAt, lastModelError: undefined });

    const apiKey = env.GEMINI_API_KEY_1 || env.GEMINI_API_KEY_2;
    const analysis = await askGemini(apiKey, env.GEMINI_MODEL, "market", current, baseline, score);
    if (!analysis) return;

    await writeRuntimeState(env, { lastModelAnalyzed: Date.now() });
    const expectedLow = Number.isFinite(analysis.expectedLowUsd) ? analysis.expectedLowUsd.toFixed(8) : "n/a";
    const expectedHigh = Number.isFinite(analysis.expectedHighUsd) ? analysis.expectedHighUsd.toFixed(8) : "n/a";
    const confidencePct = (analysis.confidence * 100).toFixed(1);
    const anomalyPct = (analysis.anomalyScore * 100).toFixed(1);
    const message = `🧠 Ciel model\nToken: ${current.token}\nAction: ${analysis.action}\nConfidence: ${confidencePct}%\nAnomaly: ${anomalyPct}%\nRegime: ${analysis.regime}\nExpected: $${expectedLow} - $${expectedHigh}\nRationale: ${analysis.rationale}`;
    await notifyTelegram(env, message.slice(0, 3900));
  } catch (error) {
    const message = String(error).slice(0, 1000);
    await writeRuntimeState(env, { lastModelMaintenance: maintenanceAt, lastModelError: message });
    console.error(`Model maintenance failed: ${message}`);
  }
}'''
          if replacement not in text:
            p.write_text(text[:start] + replacement + text[end:])
          PY
      - run: npm install
      - run: npm run typecheck
      - name: Commit repaired source
        shell: bash
        run: |
          if git diff --quiet -- src/index.ts; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.ts
          git commit -m "fix: repair hourly Gemini model maintenance"
          git push origin HEAD:main
