name: Apply market intelligence Telegram report throttle

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Patch market discovery Telegram reporting
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/market_discovery.ts")
          text = path.read_text(encoding="utf-8")
          marker = '  await sendMarketPulse(env, state);'
          if marker not in text:
              raise SystemExit("Could not find market pulse send")
          guard = '''  const reportNow = Date.now();
          const lastReport = Number(await env.CIEL_STATE.get("ciel_market_intelligence_last_report_ms") || "0");
          if (lastReport > 0 && reportNow - lastReport < 3 * 60 * 1000) return 0;
          await env.CIEL_STATE.put("ciel_market_intelligence_last_report_ms", String(reportNow), { expirationTtl: 600 });
'''
          updated = text.replace(marker, guard + marker, 1)
          if updated == text:
              raise SystemExit("No change made")
          path.write_text(updated, encoding="utf-8")
      - name: Commit patched file
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/market_discovery.ts
          git diff --cached --check
          git diff --cached -- src/market_discovery.ts
          git commit -m "Throttle duplicate market intelligence Telegram reports"
          git push origin HEAD:main
