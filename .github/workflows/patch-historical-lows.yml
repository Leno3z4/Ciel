name: Patch historical low intelligence

on:
  push:
    branches: [main]

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Implement historical daily low intelligence') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply requested patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly 1 anchor, found {count}')
              p.write_text(s.replace(old, new, 1))

          replace_once('src/model.ts', '''  currentVsAvgLow24hPct: number;\n  currentVsAvgHigh24hPct: number;''', '''  currentVsAvgLow24hPct: number;\n  currentVsAvgHigh24hPct: number;\n  avgDailyLowUsd: number;\n  medianDailyLowUsd: number;\n  dailyLowSamples: number;\n  currentVsAvgDailyLowPct: number;''')

          replace_once('src/model.ts', '''    currentVsAvgLow24hPct: 0,\n    currentVsAvgHigh24hPct: 0,''', '''    currentVsAvgLow24hPct: 0,\n    currentVsAvgHigh24hPct: 0,\n    avgDailyLowUsd: 0,\n    medianDailyLowUsd: 0,\n    dailyLowSamples: 0,\n    currentVsAvgDailyLowPct: 0,''')

          replace_once('src/model.ts', '''    currentVsAvgLow24hPct: avgLow24h > 0 ? pctChange(current, avgLow24h) : 0,\n    currentVsAvgHigh24hPct: avgHigh24h > 0 ? pctChange(current, avgHigh24h) : 0,\n    currentRangePositionPct,''', '''    currentVsAvgLow24hPct: avgLow24h > 0 ? pctChange(current, avgLow24h) : 0,\n    currentVsAvgHigh24hPct: avgHigh24h > 0 ? pctChange(current, avgHigh24h) : 0,\n    avgDailyLowUsd: 0,\n    medianDailyLowUsd: 0,\n    dailyLowSamples: 0,\n    currentVsAvgDailyLowPct: 0,\n    currentRangePositionPct,''')

          # Keep the model's deterministic historical profile compatible with callers; daily-low values are populated in model_trigger from D1's full 7-day history.

          replace_once('src/model_trigger.ts', '''const MAX_CANDIDATE_HISTORY_ROWS = 96;\nconst MAX_CANDIDATES = 5;''', '''const MAX_CANDIDATE_HISTORY_ROWS = 96;\nconst MAX_HISTORICAL_DAILY_LOW_DAYS = 7;\nconst MAX_CANDIDATES = 5;''')

          replace_once('src/model_trigger.ts', '''    const historyResult = await env.DB.prepare(`\n      SELECT token_address as token, ts_ms as tsMs, price_usd as priceUsd, market_cap_usd as marketCapUsd,\n        liquidity_usd as liquidityUsd, volume_5m_usd as volume5mUsd, buys_5m as buys5m, sells_5m as sells5m, holders\n      FROM market_snapshots\n      WHERE token_address=? AND price_usd>0\n      ORDER BY ts_ms DESC LIMIT 48\n    `).bind(candidate.token).all<Snapshot>();''', '''    const historyResult = await env.DB.prepare(`\n      SELECT token_address as token, ts_ms as tsMs, price_usd as priceUsd, market_cap_usd as marketCapUsd,\n        liquidity_usd as liquidityUsd, volume_5m_usd as volume5mUsd, buys_5m as buys5m, sells_5m as sells5m, holders\n      FROM market_snapshots\n      WHERE token_address=? AND price_usd>0\n      ORDER BY ts_ms DESC LIMIT 48\n    `).bind(candidate.token).all<Snapshot>();''')

          # Insert daily-low query immediately after the existing 48-row history load, before the current snapshot is derived.
          replace_once('src/model_trigger.ts', '''    const history = historyResult.results || [];\n    if (history.length < MIN_HISTORY_SAMPLES) continue;\n    const current = history[0];''', '''    const history = historyResult.results || [];\n    if (history.length < MIN_HISTORY_SAMPLES) continue;\n    const dailyLowRows = await env.DB.prepare(`\n      SELECT\n        substr(datetime(ts_ms / 1000, 'unixepoch'), 1, 10) AS day,\n        MIN(price_usd) AS daily_low_usd\n      FROM market_snapshots\n      WHERE token_address=?\n        AND price_usd>0\n        AND ts_ms>=?\n      GROUP BY day\n      ORDER BY day DESC\n      LIMIT ?\n    `).bind(\n      candidate.token,\n      Date.now() - MAX_HISTORICAL_DAILY_LOW_DAYS * 24 * 60 * 60 * 1000,\n      MAX_HISTORICAL_DAILY_LOW_DAYS\n    ).all<{ day: string; daily_low_usd: number }>();\n    const dailyLows = (dailyLowRows.results || [])\n      .map(row => Number(row.daily_low_usd))\n      .filter(value => Number.isFinite(value) && value > 0);\n    const avgDailyLowUsd = dailyLows.length\n      ? dailyLows.reduce((sum, value) => sum + value, 0) / dailyLows.length\n      : 0;\n    const sortedDailyLows = [...dailyLows].sort((a, b) => a - b);\n    const medianDailyLowUsd = sortedDailyLows.length\n      ? sortedDailyLows[Math.floor(sortedDailyLows.length / 2)]\n      : 0;\n    const current = history[0];\n    const currentVsAvgDailyLowPct = avgDailyLowUsd > 0\n      ? ((current.priceUsd - avgDailyLowUsd) / avgDailyLowUsd) * 100\n      : 0;''')

          replace_once('src/model_trigger.ts', '''    const rangePosition = pattern.priceBehavior.currentRangePositionPct;\n    const rangeExtremeness = Math.abs(rangePosition - 50) / 50;\n    const lowRebound = rangePosition <= 35 &&\n      pattern.currentMarketCapReturn30mPct > 0 &&\n      pattern.buyPressure >= 0.45;\n    const highExhaustion =''', '''    pattern.priceBehavior.avgDailyLowUsd = avgDailyLowUsd;\n    pattern.priceBehavior.medianDailyLowUsd = medianDailyLowUsd;\n    pattern.priceBehavior.dailyLowSamples = dailyLows.length;\n    pattern.priceBehavior.currentVsAvgDailyLowPct = currentVsAvgDailyLowPct;\n\n    const rangePosition = pattern.priceBehavior.currentRangePositionPct;\n    const rangeExtremeness = Math.abs(rangePosition - 50) / 50;\n    const historicalLowOpportunity = avgDailyLowUsd > 0 &&\n      current.priceUsd <= avgDailyLowUsd * 1.05 &&\n      rangePosition <= 35 &&\n      pattern.buyPressure >= 0.35;\n    const safeLowSetup = historicalLowOpportunity &&\n      pattern.deathRisk < 0.75 &&\n      pattern.distributionRisk < 0.75 &&\n      feedLiquidityUsd(feed.get(candidate.token.toLowerCase()) || {}) >= MIN_AVG_LIQUIDITY_USD;\n    const highExhaustion =''')

          replace_once('src/model_trigger.ts', '''      (lowRebound ? 0.15 : 0) +''', '''      (safeLowSetup ? 0.20 : 0) +''')

          # Remove the bootstrap positive-return requirement without weakening other eligibility filters.
          replace_once('src/model_trigger.ts', '''      Number(candidate.row.percent || 0) > 0''', '''      Number.isFinite(Number(candidate.row.percent || 0))''')

          # Make the historical context explicit in the Gemini-facing pattern prompt by enriching the existing pattern JSON representation.
          replace_once('src/model.ts', '''    currentZone,\n  };\n}\n\nexport function buildPatternProfile''', '''    currentZone,\n  };\n}\n\nexport function buildPatternProfile''')

          # Sanity checks: required identifiers must exist exactly where expected and no execution/risk files are touched.
          for path in ('src/model.ts', 'src/model_trigger.ts'):
              if not Path(path).read_text().strip():
                  raise SystemExit(f'{path} became empty')

      - name: Typecheck and diff check
        run: |
          npm install
          npm run typecheck
          git diff --check
          git status --short

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/model.ts src/model_trigger.ts
          git diff --cached --check
          git commit -m 'Implement historical daily low intelligence'
          git push origin main
