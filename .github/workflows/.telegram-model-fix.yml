name: Repair hourly model maintenance

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch model maintenance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/index.ts')
          text = p.read_text()
          start = text.index('async function runModelMaintenance(env: Env) {')
          end = text.index('\n\nasync function status(env: Env) {', start)
          replacement = r'''async function runModelMaintenance(env: Env) {
  const maintenanceAt = Date.now();
  try {
    await ensureDatabaseSchema(env);

    const latest = await env.DB.prepare(`SELECT token_address,ts_ms,price_usd,market_cap_usd,liquidity_usd,volume_5m_usd,buys_5m,sells_5m,holders
      FROM market_snapshots WHERE price_usd>0 ORDER BY ts_ms DESC LIMIT 1`).first<Snapshot>();
    if (!latest) {
      await writeRuntimeState(env, { lastModelMaintenance: maintenanceAt, lastModelError: undefined });
      return;
    }

    const historyResult = await env.DB.prepare(`SELECT token_address,ts_ms,price_usd,market_cap_usd,liquidity_usd,volume_5m_usd,buys_5m,sells_5m,holders
      FROM market_snapshots WHERE token_address=? ORDER BY ts_ms DESC LIMIT 50`).bind(latest.token_address).all();
    const history = (historyResult.results || []).map((row) => ({
      token: String(row.token_address),
      tsMs: Number(row.ts_ms),
      priceUsd: Number(row.price_usd),
      marketCapUsd: Number(row.market_cap_usd),
      liquidityUsd: Number(row.liquidity_usd),
      volume5mUsd: Number(row.volume_5m_usd),
      buys5m: Number(row.buys_5m),
      sells5m: Number(row.sells_5m),
      holders: Number(row.holders)
    } satisfies Snapshot));
    const current = history[0] || latest;
    const baseline = buildBaseline(history);
    const score = deviationScore(current, baseline);
    await writeRuntimeState(env, { lastModelMaintenance: maintenanceAt, lastModelError: undefined });

    const apiKey = env.GEMINI_API_KEY_1 || env.GEMINI_API_KEY_2;
    const analysis = await askGemini(apiKey, env.GEMINI_MODEL, "market", current, baseline, score);
    if (!analysis) return;

    await writeRuntimeState(env, { lastModelAnalyzed: Date.now() });
    const expectedLow = Number.isFinite(analysis.expectedLowUsd) ? analysis.expectedLowUsd.toFixed(8) : "n/a";
    const expectedHigh = Number.isFinite(analysis.expectedHighUsd) ? analysis.expectedHighUsd.toFixed(8) : "n/a";
    const confidencePct = (analysis.confidence * 100).toFixed(1);
    const anomalyPct = (analysis.anomalyScore * 100).toFixed(1);
    await notifyTelegram(env, `🧠 Ciel model\nToken: ${current.token}\nAction: ${analysis.action}\nConfidence: ${confidencePct}%\nAnomaly: ${anomalyPct}%\nRegime: ${analysis.regime}\nExpected: $${expectedLow} - $${expectedHigh}\nRationale: ${analysis.rationale}`.slice(0, 3900));
  } catch (error) {
    const message = String(error).slice(0, 1000);
    await writeRuntimeState(env, { lastModelMaintenance: maintenanceAt, lastModelError: message });
    console.error(`Model maintenance failed: ${message}`);
  }
}'''
          p.write_text(text[:start] + replacement + text[end:])
          PY
      - name: Typecheck
        run: |
          npm install
          npm run typecheck
      - name: Commit repair to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.ts
          git diff --cached --quiet || git commit -m "fix: use correct Gemini maintenance inputs"
          git push origin HEAD:main
