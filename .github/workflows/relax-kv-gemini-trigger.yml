name: Relax KV Gemini trigger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch trigger gate and validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/kv_intelligence.ts")
          text = path.read_text()

          replacements = [
              (
                  '''const KV_DECISION_COOLDOWN_MS = 30 * 60 * 1000;\nconst GEMINI_KEY_COOLDOWN_MS = 5 * 60 * 1000;''',
                  '''const KV_DECISION_COOLDOWN_MS = 30 * 60 * 1000;\nconst GEMINI_EVALUATION_COOLDOWN_MS = 30 * 60 * 1000;\nconst GEMINI_KEY_COOLDOWN_MS = 5 * 60 * 1000;'''
              ),
              (
                  '''  geminiKeyCooldowns: Record<string, number>;\n  lastGeminiDecisionAt: number;''',
                  '''  geminiKeyCooldowns: Record<string, number>;\n  lastGeminiDecisionAt: number;\n  lastGeminiEvaluationAt: number;'''
              ),
              (
                  '''  return { version: 1, updatedTsMs: 0, markets: {}, geminiCursor: 0, geminiKeyCooldowns: {}, lastGeminiDecisionAt: 0 };''',
                  '''  return { version: 1, updatedTsMs: 0, markets: {}, geminiCursor: 0, geminiKeyCooldowns: {}, lastGeminiDecisionAt: 0, lastGeminiEvaluationAt: 0 };'''
              ),
              (
                  '''      geminiKeyCooldowns: parsed.geminiKeyCooldowns || {},\n      lastGeminiDecisionAt: num(parsed.lastGeminiDecisionAt)''',
                  '''      geminiKeyCooldowns: parsed.geminiKeyCooldowns || {},\n      lastGeminiDecisionAt: num(parsed.lastGeminiDecisionAt),\n      lastGeminiEvaluationAt: num(parsed.lastGeminiEvaluationAt)'''
              ),
              (
                  '''function meaningfulTrigger(history: Snapshot[]): boolean {\n  if (history.length < MIN_HISTORY_SAMPLES) return false;\n  const pattern = buildPatternProfile(history);\n  const behavior = pattern.priceBehavior;\n  const improving = pattern.currentMarketCapReturn30mPct >= 2 && pattern.volumeVsBaseline >= 1.15;\n  const enteringLow = behavior.currentZone === "LOW" && pattern.currentMarketCapReturn30mPct >= -5;\n  const strongTrend = pattern.currentMarketCapReturn30mPct >= 8 && pattern.volumeVsBaseline >= 1.25;\n  return (enteringLow && improving) || strongTrend;\n}''',
                  '''function meaningfulTrigger(history: Snapshot[]): boolean {\n  if (history.length < MIN_HISTORY_SAMPLES) return false;\n  const latest = history[0];\n  return latest.marketCapUsd >= MIN_MARKET_CAP_USD &&\n    latest.liquidityUsd >= MIN_LIQUIDITY_USD &&\n    latest.priceUsd > 0;\n}'''
              ),
              (
                  '''  if (market && market.decisionCooldownUntil > now) {\n    await writeGeminiLiveStatus(env, {\n      lastGeminiCycleStatus: "SKIPPED_DECISION_COOLDOWN",\n      lastGeminiCycleToken: token,\n      lastGeminiCycleSnapshotAt: history[0]?.tsMs || 0\n    });\n    return false;\n  }\n\n  await writeGeminiLiveStatus(env, {''',
                  '''  if (market && market.decisionCooldownUntil > now) {\n    await writeGeminiLiveStatus(env, {\n      lastGeminiCycleStatus: "SKIPPED_DECISION_COOLDOWN",\n      lastGeminiCycleToken: token,\n      lastGeminiCycleSnapshotAt: history[0]?.tsMs || 0\n    });\n    return false;\n  }\n\n  if (state.lastGeminiEvaluationAt > 0 && now - state.lastGeminiEvaluationAt < GEMINI_EVALUATION_COOLDOWN_MS) {\n    await writeGeminiLiveStatus(env, {\n      lastGeminiCycleStatus: "SKIPPED_GEMINI_GLOBAL_COOLDOWN",\n      lastGeminiCycleToken: token,\n      lastGeminiCycleSnapshotAt: history[0]?.tsMs || 0\n    });\n    return false;\n  }\n\n  state.lastGeminiEvaluationAt = now;\n\n  await writeGeminiLiveStatus(env, {'''
              )
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"expected source block not found: {old[:80]!r}")
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one source block, found {text.count(old)}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          npm install
          npm run typecheck

      - name: Commit validated source change and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/relax-kv-gemini-trigger.yml
          git add src/kv_intelligence.ts
          git commit -m "Relax KV Gemini trigger gate"
          git push origin HEAD:main
