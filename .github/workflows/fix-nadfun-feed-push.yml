name: Fix NadFun feed resiliency

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Harden NadFun market feed against rate limits'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch feed throttling and validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("src/market_discovery.ts")
          text = path.read_text()
          old = '''const API_BASE = "https://api.nadapp.net";\nconst DISCOVERY_REFRESH_MS = 2 * 60 * 1000;\nconst MARKET_LIMIT = 50;\nconst FALLBACK_TOKEN_LIMIT = 8;'''
          new = '''const API_BASE = "https://api.nadapp.net";\nconst DISCOVERY_REFRESH_MS = 2 * 60 * 1000;\nconst FEED_ATTEMPT_MIN_INTERVAL_MS = 2 * 60 * 1000;\nconst MARKET_LIMIT = 50;\nconst FALLBACK_TOKEN_LIMIT = 8;'''
          if old not in text: raise SystemExit("constants block not found")
          text = text.replace(old, new, 1)
          old = '''async function sendCachedPulse(env: Env): Promise<void> {\n  const state = await readMarketState(env);\n  if (!state) return;\n  await sendMarketPulse(env, state);\n}\n'''
          new = '''async function sendCachedPulse(env: Env): Promise<void> {\n  const state = await readMarketState(env);\n  if (!state) return;\n  await sendMarketPulse(env, state);\n}\n\nasync function readFeedStatus(env: Env): Promise<Record<string, unknown>> {\n  const raw = await env.CIEL_STATE.get(FEED_STATUS_KEY);\n  if (!raw) return {};\n  try { return JSON.parse(raw) as Record<string, unknown>; } catch { return {}; }\n}\n\nfunction feedStatusIsRecent(status: Record<string, unknown>, now: number): boolean {\n  const attemptAt = Number(status.attemptAt || 0);\n  return Number.isFinite(attemptAt) && attemptAt > 0 && now - attemptAt < FEED_ATTEMPT_MIN_INTERVAL_MS;\n}\n\nfunction feedStatusWasRateLimited(status: Record<string, unknown>): boolean {\n  return Number(status.httpStatus || 0) === 429;\n}\n'''
          if old not in text: raise SystemExit("sendCachedPulse block not found")
          text = text.replace(old, new, 1)
          old = '''export async function primeMarketDiscovery(env: Env): Promise<void> {\n  const now = Date.now();\n  const state = await readMarketState(env);\n  if (state && state.fetchedAt > 0 && now - state.fetchedAt < DISCOVERY_REFRESH_MS) {\n    await sendCachedPulse(env);\n    return;\n  }\n\n  const ranked = await fetchMarketCapFeed(env);\n  if (ranked.length && await save(env, ranked, "market-cap")) return;\n\n  const creation = await fetchCreationFeed(env);\n  if (creation.length && await save(env, creation, "creation-time")) return;\n\n  const recentTokens = await fetchRecentEventTokens();\n'''
          new = '''export async function primeMarketDiscovery(env: Env): Promise<void> {\n  const now = Date.now();\n  const state = await readMarketState(env);\n  const feedStatus = await readFeedStatus(env);\n\n  if (state && state.fetchedAt > 0 && now - state.fetchedAt < DISCOVERY_REFRESH_MS) {\n    await sendCachedPulse(env);\n    return;\n  }\n\n  if (feedStatusIsRecent(feedStatus, now)) {\n    await sendCachedPulse(env);\n    return;\n  }\n\n  const ranked = await fetchMarketCapFeed(env);\n  if (ranked.length && await save(env, ranked, "market-cap")) return;\n\n  const primaryStatus = await readFeedStatus(env);\n  if (feedStatusWasRateLimited(primaryStatus)) {\n    await sendCachedPulse(env);\n    return;\n  }\n\n  const creation = await fetchCreationFeed(env);\n  if (creation.length && await save(env, creation, "creation-time")) return;\n\n  const creationStatus = await readFeedStatus(env);\n  if (feedStatusWasRateLimited(creationStatus)) {\n    await sendCachedPulse(env);\n    return;\n  }\n\n  const recentTokens = await fetchRecentEventTokens();\n'''
          if old not in text: raise SystemExit("primeMarketDiscovery block not found")
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          npm install
          npm run typecheck
      - name: Commit validated change and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/market_discovery.ts
          git rm .github/workflows/fix-nadfun-feed-push.yml
          git commit -m "Harden NadFun market feed against rate limits"
          git push origin HEAD:main
