name: Apply D1 cron routing fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Patch worker cron routing
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("src/worker.ts")
          text = path.read_text(encoding="utf-8")

          pattern = re.compile(
              r'(    if \(controller\.cron === "\*/3 \* \* \* \*"\) \{.*?\n      \}\)\(\);\n)(      return;\n)(    \}\n\n    if \(controller\.cron === "\*/10 \* \* \* \*"\) \{)',
              re.DOTALL,
          )

          updated, count = pattern.subn(r'\1\3', text, count=1)
          if count != 1:
              raise SystemExit("Expected exactly one */3 cron return block in src/worker.ts")

          if updated == text:
              raise SystemExit("No change made")

          path.write_text(updated, encoding="utf-8")

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/worker.ts .github/workflows/apply-d1-cron-routing-fix.yml
          git rm .github/workflows/apply-d1-cron-routing-fix.yml
          git diff --cached --check
          git diff --cached -- src/worker.ts
          git commit -m "Fix D1 market cycle cron routing"
          git push origin HEAD:main
