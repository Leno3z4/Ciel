name: Apply D1 cron routing fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Patch worker cron routing
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/worker.ts")
          text = path.read_text(encoding="utf-8")

          marker = '''    if (controller.cron === "*/3 * * * *") {'''
          start = text.find(marker)
          if start < 0:
              raise SystemExit("Could not find */3 cron block in src/worker.ts")

          next_block = text.find('    if (controller.cron === "*/10 * * * *") {', start)
          if next_block < 0:
              raise SystemExit("Could not find */10 cron block after */3 block")

          block = text[start:next_block]
          needle = '      return;\n    }\n\n'
          if block.count(needle) != 1:
              raise SystemExit(f"Expected exactly one */3 terminal return; found {block.count(needle)}")

          block = block.replace(needle, '    }\n\n', 1)
          updated = text[:start] + block + text[next_block:]

          if updated == text:
              raise SystemExit("No change made")

          path.write_text(updated, encoding="utf-8")

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/worker.ts .github/workflows/apply-d1-cron-routing-fix.yml
          git rm .github/workflows/apply-d1-cron-routing-fix.yml
          git diff --cached --check
          git diff --cached -- src/worker.ts
          git commit -m "Fix D1 market cycle cron routing"
          git push origin HEAD:main
